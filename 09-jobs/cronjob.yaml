# Runs every minute. Cron format: minute hour day-of-month month day-of-week
apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid          # don't start a new run while the previous one is running
  successfulJobsHistoryLimit: 3      # keep the last 3 successful Jobs
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: beat
              image: busybox:1.36
              command: ["sh", "-c", "echo \"heartbeat at $(date)\""]
