# Process 6 "work items", 2 at a time. With completionMode: Indexed each pod gets
# a unique JOB_COMPLETION_INDEX (0..5), so it knows which item to work on.
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-work
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo \"processing item $JOB_COMPLETION_INDEX on $(hostname)\"; sleep 5; echo done"]
