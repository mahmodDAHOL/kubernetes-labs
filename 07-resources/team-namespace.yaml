# A namespace for "team-a" with guard-rails:
#   - LimitRange: default requests/limits for containers that don't specify any
#   - ResourceQuota: a total budget for the whole namespace
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest:        # applied if the container has no requests
        cpu: 100m
        memory: 64Mi
      default:               # applied if the container has no limits
        cpu: 200m
        memory: 128Mi
      max:                   # no single container may ask for more than this
        cpu: "1"
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: team-a
spec:
  hard:
    pods: "5"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    services: "3"
