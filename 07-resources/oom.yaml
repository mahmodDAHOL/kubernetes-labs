# `tail /dev/zero` keeps buffering an endless "line" in memory until it hits the 100Mi limit
# and the kernel's OOM killer kills it (exit code 137).
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  containers:
    - name: hog
      image: busybox:1.36
      command: ["tail", "/dev/zero"]
      resources:
        requests:
          memory: 50Mi
        limits:
          memory: 100Mi
