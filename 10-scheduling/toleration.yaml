# Tolerates the "dedicated=gpu:NoSchedule" taint AND requires the matching node label.
# Toleration = "I'm ALLOWED there"; nodeSelector/affinity = "I WANT to go there". You usually need both.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-job
spec:
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  nodeSelector:
    dedicated: gpu
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
