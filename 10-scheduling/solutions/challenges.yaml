# Challenge 1: node affinity with OR semantics (values list)
apiVersion: v1
kind: Pod
metadata:
  name: fast-disk
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disk
                operator: In
                values: ["ssd", "nvme"]
  containers:
    - name: app
      image: nginx:1.27
---
# Challenge 2: even spread across nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: even
spec:
  replicas: 4
  selector:
    matchLabels:
      app: even
  template:
    metadata:
      labels:
        app: even
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Without this, the tainted control-plane node still counts as a domain with 0 pods,
          # so maxSkew 1 would cap each worker at 1 pod and leave 2 replicas Pending!
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: even
      containers:
        - name: app
          image: nginx:1.27
---
# Challenge 3: run on the control plane
apiVersion: v1
kind: Pod
metadata:
  name: on-control-plane
spec:
  nodeSelector:
    kubernetes.io/hostname: lab-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
