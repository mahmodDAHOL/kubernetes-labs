# NodePort: also opens the same port (30000-32767) on EVERY node.
# Our kind config maps node port 30080 → localhost:30080 on your PC.
apiVersion: v1
kind: Service
metadata:
  name: whoami-nodeport
spec:
  type: NodePort
  selector:
    app: whoami
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
