# ⚠ SPOILER WARNING: don't read this file closely before trying the lab!
# Debug from the CLUSTER (kubectl get/describe/logs/events), like you would in real life.
# Each scenario lives in its own namespace: ts1 ... ts7.
apiVersion: v1
kind: Namespace
metadata: {name: ts1}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: ts1}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpne
---
apiVersion: v1
kind: Namespace
metadata: {name: ts2}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: ts2}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=api is working", "-listen=:5678"]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: ts2}
spec:
  selector: {app: api-server}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: v1
kind: Namespace
metadata: {name: ts3}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: ts3}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: ts3}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Namespace
metadata: {name: ts4}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: ts4}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"processing queue $QUEUE_NAME\"; sleep 10; done"]
          envFrom:
            - configMapRef: {name: worker-config}
---
apiVersion: v1
kind: Namespace
metadata: {name: ts5}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: ts5}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          livenessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Namespace
metadata: {name: ts6}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: ts6}
spec:
  replicas: 1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers:
        - name: redis
          image: redis:7
          resources:
            requests: {cpu: 100m, memory: 64Gi}
---
apiVersion: v1
kind: Namespace
metadata: {name: ts7}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: reporter-config, namespace: ts7}
data:
  app.conf: |
    report_interval=15
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reporter, namespace: ts7}
spec:
  replicas: 1
  selector: {matchLabels: {app: reporter}}
  template:
    metadata: {labels: {app: reporter}}
    spec:
      containers:
        - name: reporter
          image: busybox:1.36
          command: ["sh", "-c", "cat /config/app.conf || { echo 'FATAL: config file /config/app.conf not found'; exit 1; }; while true; do echo report sent; sleep 15; done"]
          volumeMounts:
            - {name: cfg, mountPath: /etc/config}
      volumes:
        - name: cfg
          configMap: {name: reporter-config}
