# Secrets look like ConfigMaps but are meant for sensitive data.
# `stringData` lets you write plain text; Kubernetes stores it base64-encoded in `data`.
# ⚠ base64 is NOT encryption. Never commit real secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  DB_USER: admin
  DB_PASSWORD: s3cr3t-p4ss
