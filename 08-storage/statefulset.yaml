# A 3-member StatefulSet. Each pod gets:
#   - a stable name:     web-0, web-1, web-2
#   - a stable DNS name: web-0.web.default.svc.cluster.local   (via the headless Service)
#   - its OWN PersistentVolumeClaim: data-web-0, data-web-1, data-web-2
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None          # headless: DNS returns individual pod IPs
  selector:
    app: web-sts
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web         # the headless Service that gives pods their DNS names
  replicas: 3
  selector:
    matchLabels:
      app: web-sts
  template:
    metadata:
      labels:
        app: web-sts
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
          # write the pod's own name into its volume, only on the FIRST start
          command: ["sh", "-c", "[ -f /data/index.html ] || echo \"I am $(hostname), created $(date)\" > /data/index.html"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:      # one PVC per pod, created automatically
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
