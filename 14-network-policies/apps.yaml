# A tiny 3-tier setup in namespace "netpol":
#   frontend  --->  backend  --->  db
# plus an "intruder" pod that should NOT be able to reach backend or db.
apiVersion: v1
kind: Namespace
metadata:
  name: netpol
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: netpol
  labels: {role: frontend}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: netpol
  labels: {role: intruder}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: netpol
  labels: {role: backend}
spec:
  containers:
    - name: web      # busybox's tiny web server (busybox also gives us `nc` for testing)
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo 'backend says hi' > /www/index.html && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netpol
spec:
  selector: {role: backend}
  ports: [{port: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: netpol
  labels: {role: db}
spec:
  containers:
    - name: redis
      image: redis:7
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: netpol
spec:
  selector: {role: db}
  ports: [{port: 6379}]
