# Challenge 1: a third app reachable two ways
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cherry
spec:
  replicas: 1
  selector:
    matchLabels: {app: cherry}
  template:
    metadata:
      labels: {app: cherry}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=Hello from CHERRY", "-listen=:5678"]
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata:
  name: cherry
spec:
  selector: {app: cherry}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cherry
spec:
  ingressClassName: traefik
  rules:
    - host: cherry.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: cherry, port: {number: 80}}
    - host: shop.localhost
      http:
        paths:
          - path: /cherry
            pathType: Prefix
            backend:
              service: {name: cherry, port: {number: 80}}
