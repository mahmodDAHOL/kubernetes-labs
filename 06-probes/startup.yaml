# A slow-starting app (takes 40s to "boot").
# The startupProbe gives it up to 30 x 2s = 60s; the liveness probe only begins AFTER startup succeeds.
# Without the startupProbe, the aggressive liveness probe would kill it before it ever started.
apiVersion: v1
kind: Pod
metadata:
  name: slow-start
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo booting...; sleep 40; touch /tmp/started; echo started; sleep 3600"]
      startupProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 5
        failureThreshold: 2
