# 3 nginx pods behind a Service, each with a readiness probe on /ready.html.
# Delete that file in one pod → it's removed from the Service, but NOT restarted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ready-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ready-demo
  template:
    metadata:
      labels:
        app: ready-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          lifecycle:
            postStart:           # create the file the probe checks
              exec:
                command: ["sh", "-c", "echo ready > /usr/share/nginx/html/ready.html"]
          readinessProbe:
            httpGet:
              path: /ready.html
              port: 80
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            tcpSocket:           # is nginx accepting connections at all?
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ready-demo
spec:
  selector:
    app: ready-demo
  ports:
    - port: 80
